name: Schedule Test

on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Print time
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "UTC Time:"
          date -u
          echo "Beijing Time:"
          TZ=Asia/Shanghai date
